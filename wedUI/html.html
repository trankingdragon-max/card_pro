<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="x-ua-compatible"content="ie=edge">
    <link rel="stylesheet" href="https://unpkg.com/@tailwindcss/browser@4">
    <link rel="stylesheet" href="https://unpkg.tailwindcss/com">
     <link rel="stylesheet" href="https://cdnjs.jsdelivr.com/ajax/libs/@bootstrap/5.3.0/umd/css/bootstrap/bootstrap.min.css">
     <script src="https://cdnjs.jsdelivr.com/ajax/libs/@bootstrap/5.3.0/umd/js/bootstrap/bootstrap.min.js"></script>
     <link rel="stylesheet" href="https://unpkg.com/vue@18.3.0/umd/css/vue.min.css">
 <script src="https://unpkg.com/vue@18.3.0/umd/js/vue.min.js"></script>
<style type="text/css">
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
         body{
            display:flex;
            justify-content: center;
            align-items: center;
         }
         .container {
            position: relative;
            width:200px;
            height:130px;
            display: block;
            background: red;
         }
         .container::before{
            content:"";
             position: relative;
            width:200px;
            height:130px;
            background: #000;
         }
         
         @keyframes name {
            from {
    opacity: 0;
    transform: translateX(100px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
         }
         .container::after{
            content:"";
            position: absolute;
            top:0;
            left:0;
            width:200px;
            height:130px;
            background: #0f0f;
            animation-name:name;
            animation-timing-function:ease-in-out;
            animation-duration:2s;
            animation-range: 10% 90%;
            animation-iteration-count: infinite;
         }
    </style>
    <title>Document</title>
</head>
<body>
    <div class="container">
         <form action="">
            <table border="1">
                <th rowspan="1">
                    <h1>LOGIN</h1> 
                </th>
                <tbody rowspan="1">
                    <tr><td class="text-transform-capitalize"><label for="">username:</label>
                    <input type="text" id="username" ></td></tr>
                    <tr><td ><label for="password">password:</label>
                    <input type="text" id="password"></td></tr> 
                </tbody>
            </table>
         </form>
    </div>
    
</body>
<script src="./main2.js"></script>
</html>
